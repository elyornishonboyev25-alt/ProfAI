name: ProfAI CI

on:
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies for result recovery regressions
        run: npm ci --prefix backend

      - name: Check retired page responses and route access
        run: npm run test:retired-pages

      - name: Check result recovery and account sync
        run: npm run test:result-resilience

      - name: Build frontend
        run: npm run build

      - name: Check release build validation gate and isolated web runtime
        run: npm run test:release-build && node --test scripts/tests/web-deploy.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_test_pro

      - name: Build backend
        run: npm run build
        working-directory: backend

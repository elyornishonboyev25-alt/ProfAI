name: ProfAI CI

on:
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies for result recovery regressions
        run: npm ci --prefix backend

      - name: Generate Prisma client for frontend regression tests
        run: npm run prisma:generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_test_pro

      - name: Check retired page responses and route access
        run: npm run test:retired-pages

      - name: Check result recovery and account sync
        run: npm run test:result-resilience

      - name: Check public profile and account statistics consistency
        run: npm run test:profile-consistency

      - name: Check adaptive SAT routing and historical attempts
        run: npm run test:sat-adaptive

      - name: Check report handling and support conversations
        run: npm run test:support

      - name: Check live voice controls and automatic recovery
        run: node scripts/test-listening-parts-ui.mjs scripts/tests/voice-controls-ui.tsx && node scripts/test-listening-parts-ui.mjs scripts/tests/voice-recovery-ui.tsx && node scripts/test-listening-parts-ui.mjs scripts/tests/realtime-coach-streaming.tsx

      - name: Check Nova session stability and gateway errors
        run: node scripts/test-listening-parts-ui.mjs scripts/tests/nova-voice-stability.tsx && node scripts/test-listening-parts-ui.mjs scripts/tests/nova-api-errors.tsx

      - name: Check Nova study consent and audio ownership
        run: node scripts/test-listening-parts-ui.mjs scripts/tests/nova-study-ui.tsx

      - name: Check Nova learning notes, memory controls and audio-clock delivery
        run: node scripts/test-listening-parts-ui.mjs scripts/tests/nova-v3-ui.tsx && node scripts/test-listening-parts-ui.mjs scripts/tests/nova-v2-ui.tsx && node scripts/test-listening-parts-ui.mjs scripts/tests/nova-tts-segments.tsx && node scripts/measure-nova-regressions.mjs --assert

      - name: Check durable Writing recovery
        run: |
          node scripts/test-listening-parts-ui.mjs scripts/tests/writing-submission-ui.tsx
          node scripts/test-listening-parts-ui.mjs scripts/tests/ielts-review-recovery-ui.tsx
          node scripts/test-listening-parts-ui.mjs scripts/tests/ielts-review-improvements-ui.tsx
          node scripts/test-listening-parts-ui.mjs scripts/tests/coach-studio.tsx
          node scripts/test-listening-parts-ui.mjs scripts/tests/full-mock-flow-ui.tsx

      - name: Build frontend
        run: npm run build

      - name: Check release build validation gate and isolated web runtime
        run: npm run test:release-build && node --test scripts/tests/web-deploy.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_test_pro

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Check Nova persona, live voice protocol and session recovery
        run: node --test scripts/nova-voice-reliability.test.mjs scripts/nova-persona.test.mjs scripts/nova-v3.test.mjs scripts/nova-v2.test.mjs scripts/assistant-coach.test.mjs scripts/speaking-audio.test.mjs scripts/gemini-live.test.mjs scripts/voice-allowance.test.mjs ../scripts/tests/nova-pcm-capture.test.mjs
        working-directory: backend

      - name: Check durable Writing assessment jobs
        run: node --test scripts/writing-assessment.test.mjs scripts/writing-submission.test.mjs
        working-directory: backend

      - name: Check API deployment file copies and isolated runtime
        run: node --test scripts/tests/backend-deploy.test.mjs

      - name: Check Nova source tools, account ownership and exam integrity
        run: node --test scripts/nova-study.test.mjs
        working-directory: backend

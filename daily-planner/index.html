<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Rejalar</title>
  <style>
    :root { color-scheme: light; --ink: #111; --line: #ededed; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    .app { min-height: 100vh; }
    .days { position: fixed; inset: 0 auto 0 0; width: 178px; padding: 64px 22px; border-right: 1px solid var(--line); overflow-y: auto; }
    .day { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; min-height: 43px; padding: 10px 11px; margin-bottom: 6px; border: 0; border-radius: 3px; background: none; font-size: 13px; font-weight: 600; text-align: left; }
    .day:hover { background: #f6f6f6; }
    .day[aria-current="page"] { font-weight: 700; background: #f1f1f1; }
    .day small { font-size: 11px; font-weight: 600; color: #555; font-variant-numeric: tabular-nums; }
    main { margin-left: 178px; padding: 64px 72px 100px; }
    .sheet { max-width: 980px; margin: 0 auto; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 0 0 27px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 25px; font-weight: 700; letter-spacing: -.7px; margin: 0; }
    h1 small { font-size: 13px; font-weight: 600; letter-spacing: 0; margin-left: 10px; color: #555; }
    .summary { display: flex; align-items: center; gap: 22px; }
    .counts { font-size: 12px; font-weight: 600; color: #444; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .counts strong { color: var(--ink); font-weight: 750; }
    .progress { height: 2px; background: var(--line); margin-top: 9px; overflow: hidden; }
    .progress-fill { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }
    .history { width: 64px; height: 28px; }
    .history[hidden] { display: none; }
    .task { display: flex; align-items: flex-start; gap: 17px; padding: 16px 0; }
    .check { appearance: none; -webkit-appearance: none; flex: 0 0 21px; width: 21px; height: 21px; border: 1.7px solid var(--ink); border-radius: 3px; background: white; margin: 7px 0 0; cursor: pointer; transition: background .15s, transform .2s; }
    .check:checked { background: var(--ink); transform: rotate(-4deg); }
    .check:checked::after { content: ''; display: block; width: 5px; height: 10px; margin: 2px 0 0 6px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .check:disabled { cursor: default; }
    .writing { position: relative; flex: 1; min-width: 0; }
    .text, .mirror { font-family: inherit; font-size: 22px; font-weight: 650; line-height: 1.6; letter-spacing: -.25px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .text { display: block; width: 100%; border: 0; padding: 0; resize: none; background: transparent; outline: none; overflow: hidden; border-radius: 0; }
    .text::placeholder { color: #777; font-weight: 600; }
    .writing:focus-within::after { content: ''; position: absolute; bottom: 0; left: 0; width: 24px; height: 1px; background: #bbb; }
    .mirror { position: absolute; inset: 0; color: transparent; pointer-events: none; }
    .mirror span { background: linear-gradient(var(--ink), var(--ink)) left 57% / 0% 2px no-repeat; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background-size .4s cubic-bezier(.2,.7,.3,1); }
    .completed .mirror span { background-size: 100% 2px; }
    .completed .text { color: #666; }
    .add { display: inline-flex; align-items: center; gap: 11px; margin: 18px 0 0 1px; padding: 10px 0; border: 0; background: transparent; font-size: 13px; font-weight: 650; color: #555; }
    .add:hover { color: var(--ink); }
    .add svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.7; fill: none; }
    .error { position: fixed; bottom: 20px; left: 210px; right: 32px; margin: 0; font-size: 12px; padding: 12px 16px; background: white; border: 1px solid var(--ink); }
    .desktop-only { display: none; }
    @media (max-width: 1190px) { .days { width: 156px; padding-inline: 15px; } main { margin-left: 156px; padding-inline: 44px; } }
    @media (max-width: 1023px) { .app { display: none; } .desktop-only { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 30px; text-align: center; font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <nav class="days" id="days" aria-label="Kunlar"></nav>
    <main>
      <div class="sheet">
        <header class="heading">
          <h1><span id="date"></span><small id="year"></small></h1>
          <div class="summary">
            <svg class="history" id="history" viewBox="0 0 64 28" role="img" aria-label="Kunlik rejalar grafigi" hidden></svg>
            <div>
              <div class="counts" aria-live="polite"><strong id="total">0</strong> reja <span aria-hidden="true">/</span> <strong id="done">0</strong> bajarildi</div>
              <div class="progress" id="progress" role="progressbar" aria-label="Bajarilgan rejalar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="progress-fill" id="progress-fill"></span></div>
            </div>
          </div>
        </header>
        <div id="tasks" aria-label="Kunlik rejalar"></div>
        <button class="add" id="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Reja qo‘shish</button>
      </div>
    </main>
    <p class="error" id="error" role="alert" hidden></p>
  </div>
  <p class="desktop-only">Kompyuterda oching.</p>
  <script>
    (() => {
      'use strict';
      // Keep the original key and schema so existing desktop plans stay intact.
      const STORAGE_KEY = 'kun-notebook-v1';
      const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
      const $ = id => document.getElementById(id);
      const pad = n => String(n).padStart(2, '0');
      const localDay = (date = new Date()) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      const parseDay = key => new Date(`${key}T12:00:00`);
      const formatDay = key => { const date = parseDay(key); return `${date.getDate()} ${MONTHS[date.getMonth()]}`; };
      const validDay = key => typeof key === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(key) && !Number.isNaN(parseDay(key).getTime()) && localDay(parseDay(key)) === key;
      const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let today = localDay(), selected = today, notebook, storageUnreadable = false;
      function showError(message) { $('error').textContent = message; $('error').hidden = false; }
      function validate(value) {
        if (!value || value.version !== 1 || !validDay(value.started) || !value.days || typeof value.days !== 'object' || Array.isArray(value.days)) throw new Error('Invalid notebook');
        const result = {version: 1, started: value.started, days: {}};
        if (Object.keys(value.days).length > 10000) throw new Error('Too many days');
        for (const [key, day] of Object.entries(value.days)) {
          if (!validDay(key) || key < value.started || !day || !Array.isArray(day.tasks) || day.tasks.length > 2000) throw new Error('Invalid day');
          const ids = new Set();
          result.days[key] = {tasks: day.tasks.map(task => {
            if (!task || typeof task.id !== 'string' || !task.id || ids.has(task.id) || typeof task.text !== 'string' || task.text.length > 10000 || typeof task.done !== 'boolean') throw new Error('Invalid task');
            ids.add(task.id);
            return {id: task.id, text: task.text, done: task.done};
          })};
        }
        return result;
      }
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        notebook = saved ? validate(JSON.parse(saved)) : {version: 1, started: today, days: {}};
      } catch {
        storageUnreadable = true;
        notebook = {version: 1, started: today, days: {}};
        showError('Saqlangan rejalar ochilmadi. Asl ma’lumotlar o‘zgartirilmadi; bu oynadagi yangi yozuvlar saqlanmaydi.');
      }
      if (today < notebook.started) notebook.started = today;
      function ensureDay(key) { if (!notebook.days[key]) notebook.days[key] = {tasks: []}; }
      ensureDay(today);
      const tasks = () => notebook.days[selected].tasks;
      function counts(key) {
        const items = (notebook.days[key]?.tasks || []).filter(task => task.text.trim());
        return {total: items.length, done: items.filter(task => task.done).length};
      }
      function save() {
        if (storageUnreadable) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notebook)); $('error').hidden = true; }
        catch { showError('O‘zgarishlar saqlanmadi. Brauzer xotirasida joy yoki saqlash ruxsatini tekshiring.'); }
      }
      function renderDays() {
        const nav = $('days'), scroll = nav.scrollTop;
        const keys = Object.keys(notebook.days).filter(key => key >= notebook.started && key <= today).sort().reverse();
        nav.replaceChildren();
        for (const key of keys) {
          const stats = counts(key), button = document.createElement('button'); button.className = 'day';
          button.setAttribute('aria-current', key === selected ? 'page' : 'false');
          button.setAttribute('aria-label', `${formatDay(key)}, ${parseDay(key).getFullYear()}: ${stats.total} reja, ${stats.done} bajarilgan`);
          const label = document.createElement('span'); label.textContent = key === today ? 'Bugun' : formatDay(key);
          const count = document.createElement('small'); count.textContent = stats.total ? `${stats.done}/${stats.total}` : '';
          button.append(label, count); button.onclick = () => selectDay(key); nav.append(button);
        }
        nav.scrollTop = scroll;
      }
      function renderHistory() {
        const dates = [];
        for (let offset = 6; offset >= 0; offset--) { const date = parseDay(today); date.setDate(date.getDate() - offset); const key = localDay(date); if (key >= notebook.started) dates.push(key); }
        const graph = $('history'); graph.toggleAttribute('hidden', dates.length < 2);
        if (dates.length < 2) return;
        const max = Math.max(1, ...dates.map(key => counts(key).total)), slot = 64 / dates.length;
        graph.innerHTML = dates.map((key, i) => {
          const {total, done} = counts(key), height = total / max * 25, filled = done / max * 25, x = i * slot + (slot - 5) / 2;
          return `<g><title>${formatDay(key)}: ${total} reja, ${done} bajarilgan</title><rect x="${x}" y="${28 - height}" width="5" height="${Math.max(1, height)}" fill="#e8e8e8"/><rect x="${x}" y="${28 - filled}" width="5" height="${filled}" fill="#111"/></g>`;
        }).join('');
        graph.setAttribute('aria-label', dates.map(key => { const {total, done} = counts(key); return `${formatDay(key)}: ${total} reja, ${done} bajarilgan`; }).join('; '));
      }
      function updateSummary() {
        const {total, done} = counts(selected), percent = total ? Math.round(done / total * 100) : 0;
        $('total').textContent = total; $('done').textContent = done;
        $('progress-fill').style.width = `${percent}%`;
        $('progress').setAttribute('aria-valuenow', percent);
        $('progress').setAttribute('aria-valuetext', `${total} rejadan ${done} tasi bajarilgan — ${percent}%`);
        renderDays(); renderHistory();
      }
      function resize(input) { input.style.height = 'auto'; input.style.height = `${input.scrollHeight}px`; }
      function pasteTasks(event, task, input) {
        const text = event.clipboardData?.getData('text/plain');
        if (!text || !/[\r\n]/.test(text)) return;
        event.preventDefault();
        const lines = text.split(/\r\n|\r|\n/).map(line => line.trim()).filter(Boolean);
        if (!lines.length) return;
        lines[0] = input.value.slice(0, input.selectionStart) + lines[0];
        lines[lines.length - 1] += input.value.slice(input.selectionEnd);
        if (tasks().length + lines.length - 1 > 2000 || lines.some(line => line.length > 10000)) { showError('Matn juda uzun. Uni kichikroq qismlarga bo‘lib joylang.'); return; }
        const index = tasks().indexOf(task);
        task.text = lines[0]; task.done = false;
        const added = lines.slice(1).map(line => ({id: uid(), text: line, done: false}));
        tasks().splice(index + 1, 0, ...added);
        save(); renderTasks(); updateSummary(); focusTask(added.length ? added[added.length - 1].id : task.id);
      }
      function createRow(task) {
        const row = document.createElement('div'); row.className = `task${task.done ? ' completed' : ''}`; row.dataset.id = task.id;
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.className = 'check'; checkbox.checked = task.done; checkbox.disabled = !task.text.trim(); checkbox.setAttribute('aria-label', 'Reja bajarildi');
        const writing = document.createElement('div'); writing.className = 'writing';
        const input = document.createElement('textarea'); input.className = 'text'; input.rows = 1; input.maxLength = 10000; input.value = task.text; input.placeholder = 'Reja yozing…'; input.spellcheck = false; input.setAttribute('aria-label', 'Reja matni');
        const mirror = document.createElement('div'); mirror.className = 'mirror'; mirror.setAttribute('aria-hidden', 'true');
        const strike = document.createElement('span'); strike.textContent = task.text; mirror.append(strike);
        input.addEventListener('input', () => {
          task.text = input.value; strike.textContent = task.text;
          if (!task.text.trim()) { task.done = false; checkbox.checked = false; row.classList.remove('completed'); }
          checkbox.disabled = !task.text.trim(); resize(input); save(); updateSummary();
        });
        input.addEventListener('paste', event => pasteTasks(event, task, input));
        input.addEventListener('keydown', event => {
          if (event.isComposing) return;
          if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); if (task.text.trim()) addTask(task.id); }
          if (event.key === 'Backspace' && !input.value && tasks().length > 1) {
            event.preventDefault(); const index = tasks().indexOf(task), nextFocus = tasks()[index - 1] || tasks()[index + 1];
            tasks().splice(index, 1); save(); renderTasks(); focusTask(nextFocus.id);
          }
        });
        checkbox.addEventListener('change', () => { task.done = checkbox.checked; row.classList.toggle('completed', task.done); save(); updateSummary(); });
        writing.append(mirror, input); row.append(checkbox, writing); return row;
      }
      function renderTasks() {
        if (!tasks().length) tasks().push({id: uid(), text: '', done: false});
        $('tasks').replaceChildren(...tasks().map(createRow));
        $('tasks').querySelectorAll('textarea').forEach(resize);
      }
      function focusTask(id) {
        const row = Array.from($('tasks').children).find(element => element.dataset.id === id);
        if (row) { const input = row.querySelector('textarea'); input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
      }
      function addTask(afterId = null) {
        const index = afterId ? tasks().findIndex(task => task.id === afterId) + 1 : tasks().length;
        const existing = afterId ? tasks()[index] : tasks()[tasks().length - 1];
        if (existing && !existing.text.trim()) { focusTask(existing.id); return; }
        if (tasks().length >= 2000) { showError('Bir kun uchun 2000 ta reja chegarasiga yetdingiz.'); return; }
        const task = {id: uid(), text: '', done: false}; tasks().splice(index, 0, task);
        save(); renderTasks(); focusTask(task.id);
      }
      function selectDay(key) {
        ensureDay(key); selected = key;
        $('date').textContent = formatDay(selected); $('year').textContent = parseDay(selected).getFullYear();
        renderTasks(); updateSummary();
      }
      function checkNewDay() {
        const current = localDay();
        if (current !== today) { today = current; if (today < notebook.started) notebook.started = today; ensureDay(today); selectDay(today); save(); }
      }
      $('add').onclick = () => addTask();
      window.addEventListener('focus', checkNewDay);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
      setInterval(checkNewDay, 15000);
      let resizeTimer;
      window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => document.querySelectorAll('.text').forEach(resize), 100); });
      window.addEventListener('storage', event => {
        if (event.key !== STORAGE_KEY || !event.newValue) return;
        try { notebook = validate(JSON.parse(event.newValue)); ensureDay(today); selectDay(notebook.days[selected] ? selected : today); }
        catch { showError('Boshqa oynadagi o‘zgarishlar ochilmadi.'); }
      });
      selectDay(today); save();
    })();
  </script>
</body>
</html>

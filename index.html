    <script>
      // The boot screen is plain HTML and remains visible when an older service
      // worker serves HTML that references deleted deployment chunks. Recover
      // here because application-level error handlers cannot run in that case.
      (function () {
        var recoveryKey = 'profai:boot-recovery-attempt';
        var recoveryWindowMs = 60000;
        var recoveryStarted = false;

        function storageGet(key) {
          try { return window.sessionStorage.getItem(key); } catch (_) { return null; }
        }

        function storageSet(key, value) {
          try { window.sessionStorage.setItem(key, value); } catch (_) {}
        }

        function showRetry() {
          var copy = document.querySelector('#profai-boot .profai-boot-copy');
          var button = document.getElementById('profai-boot-retry');
          if (copy) { copy.textContent = 'We could not open the page. Please try again.'; copy.style.display = 'block'; }
          if (button) button.style.display = 'block';
        }

        async function recoverBoot(force) {
          if (recoveryStarted || !document.getElementById('profai-boot')) return;

          var previousAttempt = Number(storageGet(recoveryKey) || 0);
          if (!force && previousAttempt && Date.now() - previousAttempt < recoveryWindowMs) {
            showRetry();
            return;
          }

          recoveryStarted = true;
          storageSet(recoveryKey, String(Date.now()));

          try {
            if ('serviceWorker' in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            }

            if ('caches' in window) {
              var cacheNames = await window.caches.keys();
              await Promise.all(cacheNames
                .filter(function (name) {
                  return name.indexOf('workbox-precache') !== -1 || name.indexOf('profai-app-assets') !== -1;
                })
                .map(function (name) { return window.caches.delete(name); }));
            }
          } catch (_) {
            // A network reload is still useful if browser cache APIs fail.
          }

          window.location.reload();
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          var assetUrl = target && (target.src || target.href);
          if (assetUrl && /\/(assets|src)\//.test(assetUrl)) void recoverBoot(false);
        }, true);

        window.setTimeout(function () { void recoverBoot(false); }, 10000);
        window.__profaiRetryBoot = function () { void recoverBoot(true); };
      })();
    </script>

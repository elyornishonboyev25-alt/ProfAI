<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Producing canned fruit</title><desc id="desc">Six stages: fruit is picked from trees, checked and sorted, washed, peeled and cut, placed in cans with syrup, sealed and heated, then packed for delivery.</desc>

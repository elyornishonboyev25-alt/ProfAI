<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">College campus</title><desc id="desc">In 2005 the campus had a library in the northwest, classrooms in the northeast, a sports field in the southwest and a car park in the southeast. A central path ran north-south. By 2025 the library and classrooms remained, the sports field was replaced by a science building, the car park moved to the west edge, a student centre occupied the southeast, and a new east-west path crossed the central path.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#617082"/></marker></defs>

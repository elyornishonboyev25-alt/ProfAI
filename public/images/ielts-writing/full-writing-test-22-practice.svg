<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Seaside village</title><desc id="desc">The sea and beach form the southern edge in both years, and the main road remains. In 1990 a farm occupied the west, a small row of houses the east, a shop the north and a pier reached the sea. By 2020 the farm became a hotel, more houses were built in the east, the shop became a restaurant and a marina replaced the pier. A coastal footpath was added.</desc>

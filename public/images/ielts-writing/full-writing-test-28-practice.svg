<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Public park</title><desc id="desc">A north entrance, central path and pond in the east remain. In 2000 there was woodland in the west, an open lawn in the centre and a picnic area in the southeast. By 2025 a sports court replaced the woodland, a playground replaced the lawn, a café replaced the picnic area and a cycle path was added along the northern edge.</desc>

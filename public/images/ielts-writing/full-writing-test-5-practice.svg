<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Recycling glass bottles</title><desc id="desc">Six stages: used bottles are collected in a recycling bin, transported by truck, sorted by colour, washed and crushed into small pieces, melted in a furnace, and shaped into new bottles ready for use.</desc>

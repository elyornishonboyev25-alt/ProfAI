<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Town centre</title><desc id="desc">In 2000 a market stood in the northwest, a post office in the northeast, a car park in the southwest and open land in the southeast, with a central square and an east-west road. In 2025 the market is replaced by a shopping centre, the post office by a library, the open land by a café and the car park by a bus station. The central square and road remain; a new pedestrian path links the square to the south.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#617082"/></marker></defs>

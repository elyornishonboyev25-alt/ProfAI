<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc">
  <title id="title">Rock classification frequency table</title>
  <desc id="desc">Igneous 10, metamorphic 38, sedimentary 22, total 70.</desc>
  <rect width="660" height="360" rx="24" fill="#fff"/>
  <rect x="70" y="50" width="520" height="250" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <path d="M390 50V300M70 110H590M70 170H590M70 230H590" stroke="#64748b" stroke-width="2"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="25">
    <text x="100" y="88" font-weight="700">Classification</text><text x="430" y="88" font-weight="700">Frequency</text>
    <text x="100" y="150">igneous</text><text x="470" y="150">10</text>
    <text x="100" y="210">metamorphic</text><text x="470" y="210">38</text>
    <text x="100" y="270">sedimentary</text><text x="470" y="270">22</text>
  </g>
</svg>

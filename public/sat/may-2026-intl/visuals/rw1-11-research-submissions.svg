<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Total Science Research Submissions by Topic, 2016–2019</title>
  <desc id="desc">Line graph comparing cellular and molecular biology, physics and space science, medicine and health, and animal science submissions.</desc>
  <rect width="900" height="700" rx="24" fill="#fff"/>

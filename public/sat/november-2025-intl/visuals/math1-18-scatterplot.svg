<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" role="img" aria-labelledby="title desc">
  <title id="title">Scatterplot with a positive linear association</title>
  <desc id="desc">Eight points rise approximately linearly as x increases from 1,200 to 4,300 and y increases from 800 to 4,100.</desc>
  <rect width="700" height="620" rx="18" fill="#fff"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="95" y1="520" x2="650" y2="520"/><line x1="95" y1="430" x2="650" y2="430"/>
    <line x1="95" y1="340" x2="650" y2="340"/><line x1="95" y1="250" x2="650" y2="250"/>
    <line x1="95" y1="160" x2="650" y2="160"/><line x1="95" y1="70" x2="650" y2="70"/>
    <line x1="95" y1="70" x2="95" y2="520"/><line x1="206" y1="70" x2="206" y2="520"/>
    <line x1="317" y1="70" x2="317" y2="520"/><line x1="428" y1="70" x2="428" y2="520"/>
    <line x1="539" y1="70" x2="539" y2="520"/><line x1="650" y1="70" x2="650" y2="520"/>
  </g>
  <g stroke="#0f172a" stroke-width="3">
    <line x1="82" y1="520" x2="670" y2="520"/><line x1="95" y1="540" x2="95" y2="50"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="95" y="552">0</text><text x="206" y="552">1,000</text><text x="317" y="552">2,000</text>
    <text x="428" y="552">3,000</text><text x="539" y="552">4,000</text><text x="650" y="552">5,000</text>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18" text-anchor="end">
    <text x="82" y="526">0</text><text x="82" y="436">1,000</text><text x="82" y="346">2,000</text>
    <text x="82" y="256">3,000</text><text x="82" y="166">4,000</text><text x="82" y="76">5,000</text>
  </g>
  <g fill="#111827">
    <circle cx="228" cy="448" r="7"/><circle cx="262" cy="417" r="7"/><circle cx="294" cy="385" r="7"/>
    <circle cx="350" cy="340" r="7"/><circle cx="400" cy="268" r="7"/><circle cx="466" cy="241" r="7"/>
    <circle cx="510" cy="178" r="7"/><circle cx="566" cy="151" r="7"/>
  </g>
  <text x="672" y="514" fill="#0f172a" font-family="Georgia, serif" font-size="26" font-style="italic">x</text>
  <text x="105" y="43" fill="#0f172a" font-family="Georgia, serif" font-size="26" font-style="italic">y</text>
</svg>

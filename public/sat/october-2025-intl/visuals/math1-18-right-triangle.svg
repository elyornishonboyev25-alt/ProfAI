<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Right triangle TRS</title><desc id="desc">Triangle TRS has a right angle at S, hypotenuse TR of length 79, and leg RS of length square root of 157.</desc><rect width="760" height="460" rx="20" fill="#fff"/><path d="M150 365H610V85Z" fill="#eff6ff" stroke="#111827" stroke-width="5" stroke-linejoin="round"/><path d="M570 365V325H610" fill="none" stroke="#111827" stroke-width="4"/><g fill="#111827" font-family="Georgia,serif" font-size="30" font-style="italic"><text x="112" y="383">T</text><text x="622" y="383">S</text><text x="620" y="82">R</text></g><g fill="#334155" font-family="Arial,sans-serif" font-size="25"><text x="345" y="205" transform="rotate(-31 345 205)">79</text><text x="620" y="240">√157</text></g></svg>

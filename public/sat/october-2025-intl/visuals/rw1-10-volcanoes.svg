<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Volcanoes active since 1800 and since 1960 in two countries</title>
  <desc id="desc">For volcanoes active since 1800, Nicaragua has 8 and Tanzania has 3. Since 1960, Nicaragua has 6 and Tanzania has 1.</desc>
  <rect width="760" height="460" rx="20" fill="#fff"/><text x="390" y="35" fill="#111827" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Volcanoes Active in Two Countries</text>
  <g fill="none" stroke="#d7dee8"><path d="M95 350H700M95 295H700M95 240H700M95 185H700M95 130H700M95 75H700"/></g><path d="M95 65V350H700" fill="none" stroke="#1f2937" stroke-width="2"/>
  <g fill="#334155" font-family="Arial,sans-serif" font-size="17" text-anchor="end"><text x="82" y="356">0</text><text x="82" y="301">2</text><text x="82" y="246">4</text><text x="82" y="191">6</text><text x="82" y="136">8</text><text x="82" y="81">10</text></g>
  <g><rect x="205" y="130" width="82" height="220" fill="#aebbd3" stroke="#334155"/><rect x="287" y="267.5" width="82" height="82.5" fill="#263247"/><rect x="465" y="185" width="82" height="165" fill="#aebbd3" stroke="#334155"/><rect x="547" y="322.5" width="82" height="27.5" fill="#263247"/></g>
  <g fill="#111827" font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="287" y="380">Active since 1800</text><text x="547" y="380">Active since 1960</text><text x="390" y="410">Year</text></g>
  <g font-family="Arial,sans-serif" font-size="16"><rect x="225" y="425" width="22" height="16" fill="#aebbd3" stroke="#334155"/><text x="257" y="439">Nicaragua</text><rect x="425" y="425" width="22" height="16" fill="#263247"/><text x="457" y="439">Tanzania</text></g><text x="28" y="230" fill="#111827" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" transform="rotate(-90 28 230)">Number of active volcanoes</text>
</svg>

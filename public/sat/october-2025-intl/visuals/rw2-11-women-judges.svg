  <rect width="760" height="460" rx="20" fill="#fff"/><g stroke="#d7dee8"><path d="M95 350H700M95 310H700M95 270H700M95 230H700M95 190H700M95 150H700M95 110H700M95 70H700"/></g><path d="M95 55V350H710" fill="none" stroke="#1f2937" stroke-width="2"/>

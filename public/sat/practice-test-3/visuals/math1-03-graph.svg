<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Exponential graph with y-intercept 1</title>
  <desc id="description">A coordinate plane showing an increasing exponential curve that crosses the y-axis at 1.</desc>
  <rect width="900" height="520" rx="24" fill="#ffffff"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M70 40V460 M120 40V460 M170 40V460 M220 40V460 M270 40V460 M320 40V460 M370 40V460 M420 40V460 M470 40V460 M520 40V460 M570 40V460 M620 40V460 M670 40V460 M720 40V460 M770 40V460 M820 40V460"/>
    <path d="M70 40H820 M70 70H820 M70 100H820 M70 130H820 M70 160H820 M70 190H820 M70 220H820 M70 250H820 M70 280H820 M70 310H820 M70 340H820 M70 370H820 M70 400H820 M70 430H820 M70 460H820"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <path d="M70 100H820 M70 160H820 M70 220H820 M70 280H820 M70 340H820 M70 400H820"/>
    <path d="M120 40V460 M220 40V460 M320 40V460 M420 40V460 M520 40V460 M620 40V460 M720 40V460 M820 40V460"/>
  </g>
  <g stroke="#0f172a" stroke-width="3" fill="none">

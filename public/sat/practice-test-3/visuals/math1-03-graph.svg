    <path d="M570 480V28"/>
  </g>
  <path d="M70 459.8 C210 459.5 330 458.5 420 454 C500 450 545 440 570 430 C620 410 668 370 700 310 C742 230 765 135 785 45" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="570" cy="430" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
  <g fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
    <text x="70" y="490">-10</text><text x="170" y="490">-8</text><text x="270" y="490">-6</text><text x="370" y="490">-4</text><text x="470" y="490">-2</text><text x="570" y="490">0</text><text x="670" y="490">2</text><text x="770" y="490">4</text>
  </g>
  <g fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">
    <text x="558" y="436">1</text><text x="558" y="406">2</text><text x="558" y="346">4</text><text x="558" y="286">6</text><text x="558" y="226">8</text><text x="558" y="166">10</text><text x="558" y="106">12</text><text x="558" y="46">14</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 590" role="img" aria-labelledby="title description">
  <title id="title">Scatterplot with a line of best fit</title>
  <desc id="description">A scatterplot whose line of best fit decreases from approximately negative fourteen comma fifteen point five to zero comma one point five.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#111827" />
    </marker>
    <clipPath id="plot-area">
      <rect x="80" y="56" width="510" height="510" />
    </clipPath>
  </defs>

  <rect width="650" height="590" rx="10" fill="#ffffff" />

  <g stroke="#475569" stroke-width="2.2" opacity="0.72">
    <path d="M92 77H570 M92 125H570 M92 172H570 M92 220H570 M92 268H570 M92 316H570 M92 363H570 M92 411H570 M92 459H570 M92 507H570" />
    <path d="M92 77V555 M160 77V555 M228 77V555 M296 77V555 M365 77V555 M433 77V555 M501 77V555" />
  </g>

  <g fill="none" stroke="#111827" stroke-linecap="round">
    <path d="M78 555H600" stroke-width="4" marker-end="url(#axis-arrow)" />
    <path d="M570 566V48" stroke-width="4" marker-end="url(#axis-arrow)" />
    <g stroke-width="3">
      <path d="M92 545V565 M160 545V565 M228 545V565 M296 545V565 M365 545V565 M433 545V565 M501 545V565" />
      <path d="M560 77H580 M560 125H580 M560 172H580 M560 220H580 M560 268H580 M560 316H580 M560 363H580 M560 411H580 M560 459H580 M560 507H580" />
    </g>
  </g>

  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="25" text-anchor="middle">
    <text x="92" y="584">−14</text>
    <text x="160" y="584">−12</text>
    <text x="228" y="584">−10</text>
    <text x="296" y="584">−8</text>
    <text x="365" y="584">−6</text>
    <text x="433" y="584">−4</text>
    <text x="501" y="584">−2</text>
  </g>

  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="25" text-anchor="end" dominant-baseline="middle">
    <text x="552" y="77">20</text>
    <text x="552" y="125">18</text>
    <text x="552" y="172">16</text>
    <text x="552" y="220">14</text>
    <text x="552" y="268">12</text>
    <text x="552" y="316">10</text>
    <text x="552" y="363">8</text>
    <text x="552" y="411">6</text>
    <text x="552" y="459">4</text>
    <text x="552" y="507">2</text>
  </g>

  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic">
    <text x="608" y="568">x</text>
    <text x="566" y="34">y</text>
    <text x="544" y="579">O</text>
  </g>

  <g clip-path="url(#plot-area)">
    <path d="M92 185L570 519" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <g fill="#050505">
      <circle cx="92" cy="196" r="9" />
      <circle cx="160" cy="237" r="9" />
      <circle cx="228" cy="277" r="9" />
      <circle cx="296" cy="316" r="9" />
      <circle cx="365" cy="363" r="9" />
      <circle cx="433" cy="447" r="9" />
    </g>
  </g>
</svg>

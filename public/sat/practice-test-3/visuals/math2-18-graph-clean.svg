<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 760" role="img" aria-labelledby="title description">
  <title id="title">Graph of y equals f of x plus two</title>
  <desc id="description">The graph of y equals seven minus four to the x power, with a y-intercept at six and a horizontal asymptote at y equals seven.</desc>

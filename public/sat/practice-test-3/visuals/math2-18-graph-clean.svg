    <path d="M354 746V96" stroke-width="4" marker-end="url(#axis-arrow)" />
    <g stroke-width="3">
      <path d="M264 526V546 M445 526V546 M535 526V546 M626 526V546" />
      <path d="M344 136H364 M344 216H364 M344 296H364 M344 376H364 M344 456H364 M344 616H364 M344 696H364" />
    </g>
  </g>


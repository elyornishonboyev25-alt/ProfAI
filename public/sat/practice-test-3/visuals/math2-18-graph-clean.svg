    <text x="445" y="570">1</text>
    <text x="535" y="570">2</text>
    <text x="626" y="570">3</text>
  </g>

  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="25" text-anchor="end" dominant-baseline="middle">
    <text x="336" y="136">10</text>
    <text x="336" y="216">8</text>
    <text x="336" y="296">6</text>
    <text x="336" y="376">4</text>
    <text x="336" y="456">2</text>
    <text x="336" y="616">−2</text>

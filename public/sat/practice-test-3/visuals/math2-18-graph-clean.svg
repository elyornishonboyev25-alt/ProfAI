      <path d="M0 0 8 4 0 8Z" fill="#111827" />
    </marker>
    <clipPath id="plot-area">
      <rect x="185" y="92" width="475" height="652" />
    </clipPath>
  </defs>

  <rect width="690" height="760" rx="10" fill="#ffffff" />

  <g stroke="#64748b" stroke-width="2" opacity="0.58">
    <path d="M218 136H655 M218 176H655 M218 216H655 M218 256H655 M218 296H655 M218 336H655 M218 376H655 M218 416H655 M218 456H655 M218 496H655 M218 576H655 M218 616H655 M218 656H655 M218 696H655 M218 736H655" />
    <path d="M264 118V744 M445 118V744 M535 118V744 M626 118V744" />
  </g>

  <g fill="none" stroke="#111827" stroke-linecap="round">

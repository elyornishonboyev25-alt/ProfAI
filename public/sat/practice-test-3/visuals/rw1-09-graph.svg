<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title description">
  <title id="title">Fish population in a Taiwanese tide pool</title>
  <desc id="description">A line graph of Cocos frillgoby, wavy-lined blenny, and Indo-Pacific sergeant observations from January through October 2001.</desc>
  <rect width="900" height="780" rx="24" fill="#ffffff"/>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="485" y="44" font-size="26" font-weight="700">Fish Population in a Taiwanese Tide Pool</text>
    <text x="485" y="76" font-size="22" font-weight="600">January 2001 to October 2001</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2">
    <path d="M165 115H805 M165 180H805 M165 245H805 M165 310H805 M165 375H805 M165 440H805 M165 505H805"/>
  </g>
  <g stroke="#0f172a" stroke-width="4" fill="none">
    <path d="M165 115V505H805"/>
  </g>
  <g fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="end">
    <text x="150" y="512">0</text><text x="150" y="447">5</text><text x="150" y="382">10</text><text x="150" y="317">15</text><text x="150" y="252">20</text><text x="150" y="187">25</text><text x="150" y="122">30</text>
  </g>
  <g fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">
    <text x="230" y="545">January 2001</text><text x="410" y="545">April 2001</text><text x="590" y="545">July 2001</text><text x="770" y="545">October 2001</text>
    <text x="485" y="585" font-size="22" font-weight="600">Month</text>
    <text x="54" y="310" font-size="22" font-weight="600" transform="rotate(-90 54 310)">Number of individual fish observed</text>
  </g>
  <path d="M230 505L410 375L590 440L770 440" fill="none" stroke="#0f172a" stroke-width="4"/>
  <g fill="#0f172a">
    <path d="M230 493L218 513H242Z"/><path d="M410 363L398 383H422Z"/><path d="M590 428L578 448H602Z"/><path d="M770 428L758 448H782Z"/>
  </g>
  <path d="M230 505L410 505L590 505L770 466" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="13 10"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="4">
    <rect x="221" y="496" width="18" height="18"/><rect x="401" y="496" width="18" height="18"/><rect x="581" y="496" width="18" height="18"/><rect x="761" y="457" width="18" height="18"/>
  </g>
  <path d="M230 479L410 466L590 232L770 141" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="5 9"/>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="4">
    <circle cx="230" cy="479" r="10"/><circle cx="410" cy="466" r="10"/><circle cx="590" cy="232" r="10"/><circle cx="770" cy="141" r="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">
    <path d="M180 638H260" stroke="#0f172a" stroke-width="4"/><path d="M220 626L208 646H232Z"/><text x="280" y="645">Cocos frillgoby</text>
    <path d="M180 685H260" stroke="#475569" stroke-width="4" stroke-dasharray="13 10"/><rect x="211" y="676" width="18" height="18" fill="#ffffff" stroke="#475569" stroke-width="4"/><text x="280" y="692">wavy-lined blenny</text>
    <path d="M180 732H260" stroke="#2563eb" stroke-width="4" stroke-dasharray="5 9"/><circle cx="220" cy="732" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><text x="280" y="739">Indo-Pacific sergeant</text>
  </g>
</svg>
